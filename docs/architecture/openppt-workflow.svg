<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">How OpenPPT works</title>
  <desc id="desc">Architecture and data flow from authoring sources through project creation, normalization, fail-closed validation, QA, offline preview, and editable PowerPoint export.</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { fill: #111827; font-size: 24px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 13px; }
    .lane-title { fill: #475569; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .node-title { fill: #111827; font-size: 14px; font-weight: 650; }
    .node-subtitle { fill: #6b7280; font-size: 11px; }
    .badge { font-size: 10px; font-weight: 700; text-anchor: middle; }
    .edge-label { fill: #475569; font-size: 10px; text-anchor: middle; }
    .legend { fill: #475569; font-size: 11px; }
    .note { fill: #475569; font-size: 11px; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>
  <text class="title" x="36" y="38">How OpenPPT Works</text>
  <text class="subtitle" x="36" y="62">Authoring sources → normalized Open IR → fail-closed safety gate → QA, HTML preview, and editable PPTX</text>

  <rect x="30" y="88" width="170" height="602" rx="10" fill="#eff6ff" fill-opacity="0.55" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="6,4"/>
  <rect x="220" y="88" width="210" height="602" rx="10" fill="#fff7ed" fill-opacity="0.62" stroke="#fdba74" stroke-width="1.2" stroke-dasharray="6,4"/>
  <rect x="450" y="88" width="300" height="602" rx="10" fill="#faf5ff" fill-opacity="0.55" stroke="#d8b4fe" stroke-width="1.2" stroke-dasharray="6,4"/>
  <rect x="770" y="88" width="220" height="602" rx="10" fill="#f0fdf4" fill-opacity="0.62" stroke="#86efac" stroke-width="1.2" stroke-dasharray="6,4"/>
  <rect x="1010" y="88" width="160" height="602" rx="10" fill="#f8fafc" fill-opacity="0.9" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6,4"/>

  <text class="lane-title" x="43" y="113">AUTHORING SOURCES</text>
  <text class="lane-title" x="233" y="113">PROJECT CREATION</text>
  <text class="lane-title" x="463" y="113">NORMALIZE + SAFETY CORE</text>
  <text class="lane-title" x="783" y="113">OPERATIONS</text>
  <text class="lane-title" x="1023" y="113">ARTIFACTS</text>

  <!-- Input to project-creation flows -->
  <path d="M 180 185 L 245 185" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="184" y="164" width="56" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="212" y="177">document</text>

  <path d="M 180 305 L 245 305" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="184" y="284" width="56" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="212" y="297">Markdown</text>

  <path d="M 180 425 L 245 425" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="184" y="404" width="56" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="212" y="417">OOXML ZIP</text>

  <path d="M 180 555 L 245 555" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="184" y="534" width="56" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="212" y="547">theme</text>

  <!-- Generated or imported IR rejoins the project -->
  <path d="M 405 305 L 418 305 L 418 202 L 405 202" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="407" y="246" width="24" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="419" y="259">IR</text>

  <path d="M 405 425 L 428 425 L 428 214 L 405 214" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="417" y="352" width="24" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="429" y="365">IR</text>

  <path d="M 405 555 L 438 555 L 438 226 L 405 226" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="427" y="482" width="24" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="439" y="495">IR</text>

  <!-- Main Open IR pipeline -->
  <path d="M 405 185 L 485 185" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <rect x="416" y="164" width="58" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="445" y="177">project</text>

  <path d="M 600 215 L 600 270" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <rect x="608" y="229" width="58" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="637" y="242">dispatch</text>

  <path d="M 600 350 L 600 400" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <rect x="608" y="365" width="54" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="635" y="378">page IR</text>

  <path d="M 600 480 L 600 530" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <rect x="608" y="495" width="48" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="632" y="508">leaf IR</text>

  <!-- Validated branches: IR to QA, immutable bytes to renderers -->
  <path d="M 715 550 L 755 550 L 755 240 L 795 240" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="760" y="217" width="30" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="775" y="230">IR</text>

  <path d="M 715 590 L 760 590 L 760 405 L 795 405" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="718" y="322" width="72" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="754" y="335">IR + bytes</text>

  <path d="M 715 620 L 765 620 L 765 575 L 795 575" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="718" y="596" width="72" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="754" y="609">IR + bytes</text>

  <!-- Operation outputs -->
  <path d="M 965 240 L 1030 240" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="972" y="219" width="52" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="998" y="232">issues</text>

  <path d="M 965 405 L 1030 405" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="972" y="384" width="52" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="998" y="397">HTML</text>

  <path d="M 965 575 L 1030 575" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="972" y="554" width="52" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text class="edge-label" x="998" y="567">OOXML</text>

  <!-- Authoring source nodes -->
  <g>
    <rect x="50" y="145" width="130" height="80" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="62" y="159" width="34" height="34" rx="7" fill="#dbeafe"/>
    <text class="badge" x="79" y="180" fill="#1d4ed8">IR</text>
    <text class="node-title" x="106" y="172">JSON</text>
    <text class="node-title" x="106" y="189">/ YAML</text>
    <text class="node-subtitle" x="62" y="210">deck + pages</text>
    <text class="node-subtitle" x="62" y="222">media/*</text>
  </g>

  <g>
    <rect x="50" y="270" width="130" height="70" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="62" y="283" width="34" height="34" rx="7" fill="#dbeafe"/>
    <text class="badge" x="79" y="304" fill="#1d4ed8">MD</text>
    <text class="node-title" x="106" y="299">Outline</text>
    <text class="node-subtitle" x="62" y="328">headings + bullets</text>
  </g>

  <g>
    <rect x="50" y="390" width="130" height="70" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="62" y="403" width="34" height="34" rx="7" fill="#dbeafe"/>
    <text class="badge" x="79" y="424" fill="#1d4ed8">PPTX</text>
    <text class="node-title" x="106" y="419">PowerPoint</text>
    <text class="node-subtitle" x="106" y="436">existing deck</text>
  </g>

  <g>
    <rect x="50" y="520" width="130" height="70" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="62" y="533" width="34" height="34" rx="7" fill="#dbeafe"/>
    <text class="badge" x="79" y="554" fill="#1d4ed8">T</text>
    <text class="node-title" x="106" y="549">Themes</text>
    <text class="node-subtitle" x="62" y="579">templates + tokens</text>
  </g>

  <!-- Project creation nodes -->
  <g filter="url(#soft-shadow)">
    <rect x="245" y="145" width="160" height="95" rx="10" fill="#ffffff" stroke="#fb923c" stroke-width="1.8"/>
    <rect x="259" y="160" width="38" height="38" rx="8" fill="#fed7aa"/>
    <text class="badge" x="278" y="183" fill="#c2410c">IR</text>
    <text class="node-title" x="309" y="176">OpenPPT IR</text>
    <text class="node-subtitle" x="259" y="207">deck.json / deck.yaml</text>
    <text class="node-subtitle" x="259" y="224">pages/* + media/*</text>
  </g>

  <g>
    <rect x="245" y="270" width="160" height="70" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <rect x="258" y="284" width="34" height="34" rx="7" fill="#ffedd5"/>
    <text class="badge" x="275" y="305" fill="#c2410c">MD</text>
    <text class="node-title" x="304" y="299">from-outline</text>
    <text class="node-subtitle" x="258" y="328">outline → authoring IR</text>
  </g>

  <g>
    <rect x="245" y="390" width="160" height="70" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <rect x="258" y="404" width="34" height="34" rx="7" fill="#ffedd5"/>
    <text class="badge" x="275" y="425" fill="#c2410c">ZIP</text>
    <text class="node-title" x="304" y="419">Lossy import</text>
    <text class="node-subtitle" x="258" y="448">OOXML → staged IR</text>
  </g>

  <g>
    <rect x="245" y="520" width="160" height="70" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <rect x="258" y="534" width="34" height="34" rx="7" fill="#ffedd5"/>
    <text class="badge" x="275" y="555" fill="#c2410c">NEW</text>
    <text class="node-title" x="304" y="549">init + skeleton</text>
    <text class="node-subtitle" x="258" y="578">validated starter IR</text>
  </g>

  <!-- Core pipeline nodes -->
  <g>
    <rect x="485" y="145" width="230" height="70" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
    <rect x="500" y="159" width="38" height="38" rx="7" fill="#ede9fe"/>
    <text class="badge" x="519" y="182" fill="#6d28d9">CLI</text>
    <text class="node-title" x="552" y="176">Entry and command routing</text>
    <text class="node-subtitle" x="500" y="203">Bun CLI • JavaScript public API</text>
  </g>

  <g>
    <rect x="485" y="270" width="230" height="80" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
    <rect x="500" y="287" width="38" height="38" rx="7" fill="#ede9fe"/>
    <text class="badge" x="519" y="310" fill="#6d28d9">LOAD</text>
    <text class="node-title" x="552" y="299">Load and expand pages</text>
    <text class="node-subtitle" x="552" y="317">parse JSON/YAML</text>
    <text class="node-subtitle" x="500" y="337">resolve project-local page files</text>
  </g>

  <g>
    <rect x="485" y="400" width="230" height="80" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
    <rect x="500" y="417" width="38" height="38" rx="7" fill="#ede9fe"/>
    <text class="badge" x="519" y="440" fill="#6d28d9">LAY</text>
    <text class="node-title" x="552" y="429">Expand layout groups</text>
    <text class="node-subtitle" x="552" y="447">stack • row • grid • layer</text>
    <text class="node-subtitle" x="552" y="463">absolute leaf bounds</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="485" y="530" width="230" height="110" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2"/>
    <rect x="500" y="547" width="42" height="42" rx="9" fill="#ddd6fe"/>
    <path d="M 521 554 L 534 559 L 532 573 Q 529 583 521 587 Q 513 583 510 573 L 508 559 Z" fill="#7c3aed" opacity="0.9"/>
    <text class="node-title" x="555" y="558">Fail-closed validation</text>
    <text class="node-subtitle" x="555" y="577">Ajv schema • IDs • bounds</text>
    <text class="node-subtitle" x="500" y="604">tokens • limits • media path jail</text>
    <text class="node-subtitle" x="500" y="622">immutable snapshot per operation</text>
  </g>

  <!-- Operation nodes -->
  <g>
    <rect x="795" y="200" width="170" height="80" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <rect x="810" y="217" width="38" height="38" rx="7" fill="#dcfce7"/>
    <text class="badge" x="829" y="240" fill="#047857">QA</text>
    <text class="node-title" x="861" y="229">Structural QA</text>
    <text class="node-subtitle" x="861" y="247">overlap • density</text>
    <text class="node-subtitle" x="861" y="263">margin • contrast</text>
  </g>

  <g>
    <rect x="795" y="360" width="170" height="90" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <rect x="810" y="379" width="38" height="38" rx="7" fill="#dcfce7"/>
    <rect x="817" y="386" width="24" height="17" rx="2" fill="none" stroke="#047857" stroke-width="1.5"/>
    <line x1="817" y1="391" x2="841" y2="391" stroke="#047857" stroke-width="1"/>
    <text class="node-title" x="861" y="390">HTML preview</text>
    <text class="node-subtitle" x="861" y="408">embedded snapshot</text>
    <text class="node-subtitle" x="810" y="432">not pixel-perfect</text>
  </g>

  <g>
    <rect x="795" y="530" width="170" height="90" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <rect x="810" y="549" width="38" height="38" rx="7" fill="#dcfce7"/>
    <circle cx="829" cy="568" r="9" fill="none" stroke="#047857" stroke-width="2"/>
    <circle cx="829" cy="568" r="3" fill="#047857"/>
    <text class="node-title" x="861" y="560">PPTX compiler</text>
    <text class="node-subtitle" x="861" y="578">PptxGenJS</text>
    <text class="node-subtitle" x="810" y="603">atomic output</text>
  </g>

  <!-- Artifact nodes -->
  <g>
    <rect x="1030" y="200" width="120" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 1045 214 L 1069 214 L 1077 222 L 1077 252 L 1045 252 Z" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 1069 214 L 1069 222 L 1077 222" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <text class="node-title" x="1090" y="231">QA JSON</text>
    <text class="node-subtitle" x="1045" y="265">issues + exit gate</text>
  </g>

  <g>
    <rect x="1030" y="360" width="120" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 1045 377 L 1069 377 L 1077 385 L 1077 415 L 1045 415 Z" fill="#f0fdf4" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 1069 377 L 1069 385 L 1077 385" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <text class="node-title" x="1090" y="395">HTML</text>
    <text class="node-subtitle" x="1090" y="413">offline</text>
    <text class="node-subtitle" x="1045" y="430">preview.html</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="1030" y="530" width="120" height="90" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.8"/>
    <path d="M 1045 547 L 1069 547 L 1077 555 L 1077 585 L 1045 585 Z" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
    <path d="M 1069 547 L 1069 555 L 1077 555" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <text class="node-title" x="1090" y="565">PPTX</text>
    <text class="node-subtitle" x="1090" y="583">editable</text>
    <text class="node-subtitle" x="1045" y="600">deck.pptx</text>
  </g>

  <!-- Legend and boundary note -->
  <g transform="translate(38,724)">
    <line x1="0" y1="8" x2="34" y2="8" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text class="legend" x="43" y="12">IR / command flow</text>
    <line x1="157" y1="8" x2="191" y2="8" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
    <text class="legend" x="200" y="12">project generation / import</text>
    <line x1="365" y1="8" x2="399" y2="8" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text class="legend" x="408" y="12">validated media snapshot</text>
  </g>

  <rect x="704" y="711" width="466" height="55" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text class="note" x="720" y="733">Default export is local and open-source: Bun + OpenPPT + PptxGenJS.</text>
  <text class="note" x="720" y="751">No proprietary WASM, upstream mirror, or remote image fetch is required.</text>
</svg>
